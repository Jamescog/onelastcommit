include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Deprecations are cleared as each file is rewritten during the UI phase.
    # Keep them visible as warnings rather than letting them become invisible.
    deprecated_member_use: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_parenthesis
