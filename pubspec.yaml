name: olc
description: "A local-first Flutter app to track GitHub commit activity."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  http: ^1.6.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.0
  dartz: ^0.10.1
  go_router: ^18.0.0
  flutter_secure_storage: ^9.2.4
  workmanager: ^0.10.9
  flutter_timezone: ^5.1.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
